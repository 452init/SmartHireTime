name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run checks
        run: npm run check

      - name: Build frontend
        run: npm run build

  deploy-backend-render:
    name: Deploy backend on Render
    runs-on: ubuntu-latest
    needs: validate
    permissions: {}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL secret."
            exit 1
          fi
          attempts=5
          for i in $(seq 1 $attempts); do
            response=$(curl --silent --show-error -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null)
            if [ "$response" -eq 409 ]; then
              echo "Received 409 Conflict. Retrying in 30 seconds... (Attempt $i/$attempts)"
              sleep 30
            elif [ "$response" -ge 200 ] && [ "$response" -le 299 ]; then
              echo "Deployment triggered successfully."
              exit 0
            else
              echo "Deployment failed with HTTP status $response."
              exit 1
            fi
          done
          echo "Failed to trigger deployment after $attempts attempts."
          exit 1

  deploy-frontend-vercel:
    name: Deploy frontend on Vercel
    runs-on: ubuntu-latest
    needs: validate
    permissions: {}
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Missing VERCEL_DEPLOY_HOOK_URL secret."
            exit 1
          fi
          attempts=5
          for i in $(seq 1 $attempts); do
            response=$(curl --silent --show-error -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK_URL" -o /dev/null)
            if [ "$response" -eq 409 ]; then
              echo "Received 409 Conflict. Retrying in 30 seconds... (Attempt $i/$attempts)"
              sleep 30
            elif [ "$response" -ge 200 ] && [ "$response" -le 299 ]; then
              echo "Deployment triggered successfully."
              exit 0
            else
              echo "Deployment failed with HTTP status $response."
              exit 1
            fi
          done
          echo "Failed to trigger deployment after $attempts attempts."
          exit 1
