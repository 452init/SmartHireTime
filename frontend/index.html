<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartHireTime | The Boardroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="boardroom">
      <header class="topbar">
        <div>
          <p class="eyebrow">Be Confident In Your Career</p>
          <h1>The Boardroom</h1>
        </div>
        <div class="brand-mark" aria-hidden="true">
          <span></span>
        </div>
      </header>

      <section class="workspace" aria-labelledby="page-title">
        <div class="tagline">
          <h2 id="page-title">
            Craft the Perfect <em>Interview</em>
          </h2>
          <p>Precision-engineered questions for professionals</p>
        </div>

        <form id="question-form" class="generator-panel">
          <div class="field-group">
            <label for="job-title">Position</label>
            <input
              id="job-title"
              class="gold-input"
              name="jobTitle"
              type="text"
              value="Customer Success Manager"
              placeholder="e.g. Chief Product Officer, Senior Engineer..."
              autocomplete="off"
              required
            />
          </div>

          <div class="field-group">
            <label>Seniority Level</label>
            <div id="level-options" class="pill-group" aria-label="Seniority level"></div>
          </div>

          <div class="field-group">
            <label>Focus Area</label>
            <div id="category-options" class="pill-group" aria-label="Focus area"></div>
          </div>

          <div class="action-row">
            <button id="generate-button" class="gen-btn" type="submit">
              Generate Questions
            </button>
          </div>
        </form>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <section id="loading-panel" class="loading-panel" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <p>Composing your questions...</p>
        </section>

        <section id="results-panel" class="results-panel" hidden>
          <div class="divider"></div>
          <div class="results-header">
            <h2>Interview Questions</h2>
            <span id="prepared-count">0 prepared</span>
          </div>
          <div id="questions" class="questions" aria-label="Generated questions"></div>
        </section>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
